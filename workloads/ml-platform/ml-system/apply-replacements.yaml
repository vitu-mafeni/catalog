- source:
    kind: ConfigMap
    name: kptfile.kpt.dev
    fieldPath: data.NEXT_PUBLIC_KC_URL
  targets:
  - select:
      kind: StarlarkRun
      name: substitute-env-values
    fieldPaths:
    - params.NEXT_PUBLIC_KC_URL
- source:
    kind: ConfigMap
    name: kptfile.kpt.dev
    fieldPath: data.QUOTA_API_IMAGE
  targets:
  - select:
      kind: StarlarkRun
      name: substitute-env-values
