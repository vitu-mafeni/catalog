  KEYCLOAK_REALM: "jupyterhub"
  KEYCLOAK_ADMIN_USER: "admin"
  JUPYTERHUB_API_URL: "http://hub.jhub-ns.svc.cluster.local:8081/hub/api"
  QUOTA_API_NAMESPACE: "ml-backend-system"
  JHUB_NAMESPACE: "jhub-ns"
  EG_NAMESPACE: "enterprise-gateway"
  KERNELSPECS_PVC_PATH: "/mnt/eg-kernelspecs"
  ALERTMANAGER_URL: "http://prometheus-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093"
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  GRAFANA_URL: "http://192.168.3.234:32300"
  CHECKPOINT_API_URL: "http://192.168.3.234:30829"
  QUOTA_RESTORE_ALLOW_RESIZE: "false"
  MODEL_ARTIFACT_STORAGE_CLASS: "nfs-csi"
  KERNEL_SYNC_TIMEOUT_SECONDS: "21600"

  # ── Harbor auto-seed/robot-bootstrap (see 02-configmap-quota-api.yaml) ──
  # HARBOR_ADMIN_PASSWORD is a credential — stays Secret-only, never here.
  HARBOR_BASE_URL: "http://10.9.0.13:30728"
  HARBOR_VERIFY_TLS: "false"
  HARBOR_ADMIN_USERNAME: "admin"
  HARBOR_COPY_TIMEOUT_SECONDS: "10800"

  # ── frontend (frontend-config) — must be reachable from the user's
  #    browser, not cluster-internal DNS ─────────────────────────────────
  NEXT_PUBLIC_QUOTA_API: "http://CHANGE-ME:30082"
  NEXT_PUBLIC_KC_URL: "http://CHANGE-ME:30090"
  NEXT_PUBLIC_KC_REALM: "jupyterhub"
  NEXT_PUBLIC_KC_CLIENT: "quota-admin-ui"
  # Optional (03-configmap-frontend.yaml's commented default) — uncomment
  # NEXT_PUBLIC_ADMIN_EXTERNAL_MONITORING in that ConfigMap first if this
  # target cluster should show the "Advanced Monitoring" button.
  # NEXT_PUBLIC_ADMIN_EXTERNAL_MONITORING: "http://CHANGE-ME:32300/dashboards"

  # ── Image tags (06-deployment-quota-api.yaml / 08-deployment-frontend.yaml) ──
  QUOTA_API_IMAGE: "ghcr.io/vitu-mafeni/quota-api:latest"
  FRONTEND_IMAGE: "ghcr.io/vitu-mafeni/ml-platform-frontend:latest"

  # ── Ingress hosts (10-ingress.yaml, only relevant if that Ingress is in use) ──
  PORTAL_HOST: "portal.CHANGE-ME.example.com"
  API_HOST: "api.CHANGE-ME.example.com"
