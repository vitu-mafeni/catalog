# Frontend (Next.js, standalone output) Deployment.
#
# The image is environment-agnostic: NEXT_PUBLIC_* values come from
# frontend-config (03-configmap-frontend.yaml) and are applied at CONTAINER
# STARTUP by docker-entrypoint.sh — change the ConfigMap and restart the
# pod, no image rebuild needed.
#
# CUSTOMIZE: image tag — see the README for the release flow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: jhub-ns
  labels:
    app: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Remove if the image is public — see 01-secrets.example.yaml.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          # CUSTOMIZE: pin to a specific tag for production instead of `latest`.
          image: ghcr.io/vitu-mafeni/ml-platform-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      restartPolicy: Always
