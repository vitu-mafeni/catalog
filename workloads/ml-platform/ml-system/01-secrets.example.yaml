# ============================================================================
# SECRET TEMPLATES — do not apply this file as-is.
#
# Copy it (e.g. to 01-secrets.yaml, already gitignored — see .gitignore) and
# fill in real values, OR create the secrets imperatively with `kubectl
# create secret`. Either approach works; the Deployments only care that a
# Secret with these exact names/keys exists in the namespace before they
# start.
# ============================================================================

# ── quota-api (ml-backend-system) application secrets ───────────────────────
# Required keys: keycloak-admin-password, jupyterhub-api-token, quota-api-token.
# credential-key is OPTIONAL — if omitted, quota-api auto-generates one on
# first boot and persists it to the PVC (see quota_api/config.py
# _load_credential_key()); set it explicitly here once you have a value if
# you ever need to restore the DB onto a fresh PVC and keep encrypted
# columns readable.
apiVersion: v1
kind: Secret
metadata:
  name: ml-backend-system-secrets
  namespace: ml-backend-system
type: Opaque
stringData:
  keycloak-admin-password: "REPLACE_ME"
  jupyterhub-api-token: "REPLACE_ME"
  quota-api-token: "REPLACE_ME"
  # credential-key: "REPLACE_ME"   # base64url 32-byte Fernet key — `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`
  # harbor-secret: "REPLACE_ME"          # HARBOR_SECRET — robot account token, only if HARBOR_USERNAME (02-configmap) is set
  # harbor-admin-password: "REPLACE_ME"  # HARBOR_ADMIN_PASSWORD — paired with HARBOR_ADMIN_USERNAME to auto-create a robot account instead

---
# ── Pull secret for a PRIVATE Git-registry image (GHCR/GitLab/etc.) ─────────
# Only needed if the frontend/quota-api images are private. Skip these
# Secrets and remove `imagePullSecrets:` from the Deployments below if the
# images are public (GHCR packages are PRIVATE by default on first push —
# see .github/workflows/docker-frontend.yml — either flip the package to
# public in its GitHub settings, or use this secret).
#
# One copy per namespace — Secrets don't cross namespace boundaries, and the
# frontend (jhub-ns) and quota-api (ml-backend-system) Deployments now live
# in different ones. Create both with a real PAT (classic token,
# `read:packages` scope) instead of hand-editing the base64 dockerconfigjson
# blob:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<your-github-username> \
#     --docker-password=<personal-access-token> \
#     --namespace=jhub-ns
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<your-github-username> \
#     --docker-password=<personal-access-token> \
#     --namespace=ml-backend-system
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: jhub-ns
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_ME",
          "password": "REPLACE_ME",
          "auth": "REPLACE_ME_BASE64_OF_username:password"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: ml-backend-system
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_ME",
          "password": "REPLACE_ME",
          "auth": "REPLACE_ME_BASE64_OF_username:password"
        }
      }
    }
