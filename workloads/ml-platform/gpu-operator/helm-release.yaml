apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator

spec:
  interval: 10m
  timeout: 30m

  chart:
    spec:
      chart: gpu-operator
      version: "v26.3.3"
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: gpu-operator

  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    ccManager:
      defaultMode: "off"
      enabled: false
      env:
        - name: CC_CAPABLE_DEVICE_IDS
          value: 0x2339,0x2331,0x2330,0x2324,0x2322,0x233d
      image: k8s-cc-manager
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: v0.1.1

    cdi:
      default: true
      enabled: true

    daemonsets:
      annotations: {}
      labels: {}
      priorityClassName: system-node-critical
      rollingUpdate:
        maxUnavailable: "1"
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
      updateStrategy: RollingUpdate

    dcgm:
      args: []
      enabled: false
      env: []
      image: dcgm
      imagePullPolicy: IfNotPresent
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: 4.3.1-1-ubuntu22.04

    dcgmExporter:
      enabled: true

      env:
        # - name: KUBERNETES_ENABLE_DRA
        #   value: "true"
        - name: DCGM_EXPORTER_INTERVAL
          value: "5000"
        - name: DCGM_EXPORTER_KUBERNETES
          value: "true"
        - name: DCGM_EXPORTER_KUBERNETES_GPU_ID_TYPE
          value: "uid"

      hostPID: false
      hostNetwork: false

      image: dcgm-exporter
      imagePullPolicy: IfNotPresent

      kubernetes:
        enablePodLabels: true

      rbac:
        create: true

      repository: nvcr.io/nvidia/k8s
      resources: {}

      service:
        internalTrafficPolicy: Cluster

      enablePodLabels: true
      enablePodUID: true

      serviceMonitor:
        enabled: true
        interval: 15s
        honorLabels: false

        additionalLabels:
          release: prometheus

        relabelings:
          - sourceLabels: [__meta_kubernetes_endpoint_node_name]
            regex: (.*)
            targetLabel: kubernetes_node
            replacement: $1
            action: replace

          - sourceLabels: [__meta_kubernetes_pod_node_name]
            regex: (.*)
            targetLabel: kubernetes_node
            replacement: $1
            action: replace

      version: 4.3.1-4.4.0-ubuntu22.04

      config:
        create: true
        name: dcgm-counters

        data: |-
          # Device utilization and memory
          DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization (%)
          DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (%)
          DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (MiB)
          DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (MiB)
          DCGM_FI_DEV_FB_TOTAL, gauge, Total framebuffer memory (MiB)
          DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved (MiB)

          # Temperature and power
          DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature (C)
          DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (C)
          DCGM_FI_DEV_POWER_USAGE, gauge, Power draw (W)
          DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (mJ)

          # GPU clocks
          DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency (MHz)
          DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (MHz)

          # Encoder / decoder
          DCGM_FI_DEV_ENC_UTIL, gauge, Encoder utilization (%)
          DCGM_FI_DEV_DEC_UTIL, gauge, Decoder utilization (%)

          # PCIe / reliability / remapping
          DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries
          DCGM_FI_DEV_PCIE_TX_THROUGHPUT, counter, PCIe TX
          DCGM_FI_DEV_PCIE_RX_THROUGHPUT, counter, PCIe RX
          DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for correctable errors
          DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for uncorrectable errors
          DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether remapping of rows has failed

          # vGPU
          DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU License status

          # ECC / XID
          DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, ECC SBE
          DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, ECC DBE
          DCGM_FI_DEV_XID_ERRORS, gauge, XID errors

          # NVLink legacy metric
          DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, NVLINK bandwidth

          # GPU profiling
          DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active
          DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of cycles the device memory interface is active
          DCGM_FI_PROF_SM_ACTIVE, gauge, Ratio of cycles an SM has at least one warp resident
          DCGM_FI_PROF_SM_OCCUPANCY, gauge, Ratio of resident warps to the theoretical maximum

          # Tensor pipelines
          DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles any tensor pipe is active
          DCGM_FI_PROF_PIPE_TENSOR_HMMA_ACTIVE, gauge, Ratio of cycles the HMMA (FP16/BF16) tensor pipe is active
          DCGM_FI_PROF_PIPE_TENSOR_IMMA_ACTIVE, gauge, Ratio of cycles the IMMA (INT8) tensor pipe is active
          DCGM_FI_PROF_PIPE_TENSOR_DFMA_ACTIVE, gauge, Ratio of cycles the DFMA (FP64) tensor pipe is active

          # Non-tensor compute pipelines
          DCGM_FI_PROF_PIPE_FP64_ACTIVE, gauge, Ratio of cycles the non-tensor FP64 pipe is active
          DCGM_FI_PROF_PIPE_FP32_ACTIVE, gauge, Ratio of cycles the non-tensor FP32 pipe is active
          DCGM_FI_PROF_PIPE_FP16_ACTIVE, gauge, Ratio of cycles the non-tensor FP16 pipe is active

          # PCIe profiling
          DCGM_FI_PROF_PCIE_TX_BYTES, gauge, PCIe bytes written
          DCGM_FI_PROF_PCIE_RX_BYTES, gauge, PCIe bytes read

          # NVLink profiling
          DCGM_FI_PROF_NVLINK_TX_BYTES, gauge, NVLink bytes written
          DCGM_FI_PROF_NVLINK_RX_BYTES, gauge, NVLink bytes read

          # C2C interconnect
          DCGM_FI_PROF_C2C_TX_ALL_BYTES, gauge, C2C bytes written across all links
          DCGM_FI_PROF_C2C_RX_ALL_BYTES, gauge, C2C bytes read across all links

          # Host / peer memory cache
          # These four are commented out: dcgm-exporter 4.3.1-4.4.0 on this cluster
          # hard-errored on DCGM_FI_PROF_HOSTMEM_CACHE_HIT with
          #   "could not find DCGM field; err: unknown ExporterCounter field"
          # An unknown field is FATAL (crashes the whole exporter), unlike an
          # unsupported-but-known field which DCGM just skips with a WARN.
          # Verify these field IDs exist on your DCGM version (`dcgmi discovery -l`
          # on the node) before re-enabling.
          # DCGM_FI_PROF_HOSTMEM_CACHE_HIT, gauge, Host memory cache hits
          # DCGM_FI_PROF_HOSTMEM_CACHE_MISS, gauge, Host memory cache misses
          # DCGM_FI_PROF_PEERMEM_CACHE_HIT, gauge, Peer memory cache hits
          # DCGM_FI_PROF_PEERMEM_CACHE_MISS, gauge, Peer memory cache misses

          # Integer pipeline
          # Requested even where unsupported. DCGM will log "metric not enabled"
          # and skip it rather than failing the entire registry.
          DCGM_FI_PROF_PIPE_INT_ACTIVE, gauge, Ratio of cycles the integer pipe is active          

    devicePlugin:
      args: []
      config:
        create: false
        data: {}
        default: ""
        name: ""
      enabled: false
      env: []
      image: k8s-device-plugin
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      mps:
        root: /run/nvidia/mps
      repository: nvcr.io/nvidia
      resources: {}
      version: v0.17.4

    driver:
      certConfig:
        name: ""
      enabled: true
      env: []
      image: driver
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      kernelModuleConfig:
        name: ""
      kernelModuleType: auto
      licensingConfig:
        configMapName: ""
        nlsEnabled: true
      manager:
        env: []
        image: k8s-driver-manager
        imagePullPolicy: IfNotPresent
        repository: nvcr.io/nvidia/cloud-native
        version: v0.8.1
      nvidiaDriverCRD:
        deployDefaultCR: true
        driverType: gpu
        enabled: false
        nodeSelector: {}
      rdma:
        enabled: false
        useHostMofed: false
      repoConfig:
        configMapName: ""
      repository: nvcr.io/nvidia
      resources: {}
      startupProbe:
        failureThreshold: 120
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 60
      upgradePolicy:
        autoUpgrade: true
        drain:
          deleteEmptyDir: false
          enable: false
          force: false
          podSelector: ""
          timeoutSeconds: 300
        gpuPodDeletion:
          deleteEmptyDir: false
          force: false
          timeoutSeconds: 300
        maxParallelUpgrades: 1
        maxUnavailable: 25%
        waitForCompletion:
          podSelector: ""
          timeoutSeconds: 0
      usePrecompiled: false
      version: 580.82.07
      virtualTopology:
        config: ""

    gdrcopy:
      args: []
      enabled: false
      env: []
      image: gdrdrv
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: v2.5.1

    gds:
      args: []
      enabled: false
      env: []
      image: nvidia-fs
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: 2.20.5

    gfd:
      enabled: true
      env: []
      image: k8s-device-plugin
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia
      resources: {}
      version: v0.17.4

    hostPaths:
      driverInstallDir: /run/nvidia/driver
      rootFS: /

    kataManager:
      config:
        artifactsDir: /opt/nvidia-gpu-operator/artifacts/runtimeclasses
        runtimeClasses:
          - artifacts:
              pullSecret: ""
              url: nvcr.io/nvidia/cloud-native/kata-gpu-artifacts:ubuntu22.04-535.54.03
            name: kata-nvidia-gpu
            nodeSelector: {}
          - artifacts:
              pullSecret: ""
              url: nvcr.io/nvidia/cloud-native/kata-gpu-artifacts:ubuntu22.04-535.86.10-snp
            name: kata-nvidia-gpu-snp
            nodeSelector:
              nvidia.com/cc.capable: "true"
      enabled: false
      env: []
      image: k8s-kata-manager
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: v0.2.3

    mig:
      strategy: single

    migManager:
      config:
        create: false
        data: {}
        default: all-disabled
        name: ""
      enabled: true
      env: []
      gpuClientsConfig:
        name: ""
      image: k8s-mig-manager
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: v0.12.3-ubuntu20.04

    nfd:
      enabled: true
      nodefeaturerules: false

    node-feature-discovery:
      featureGates:
        NodeFeatureGroupAPI: false
      fullnameOverride: ""
      gc:
        affinity: {}
        annotations: {}
        deploymentAnnotations: {}
        enable: true
        extraArgs: []
        extraEnvs: []
        hostNetwork: false
        interval: 1h
        metricsPort: 8081
        nodeSelector: {}
        podSecurityContext: {}
        rbac:
          create: true
        replicaCount: 1
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 10m
            memory: 128Mi
        revisionHistoryLimit: null
        serviceAccount:
          annotations: {}
          create: false
          name: node-feature-discovery
        tolerations: []

      global: {}

      master:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/master
                      operator: In
                      values:
                        - ""
                weight: 1
              - preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: In
                      values:
                        - ""
                weight: 1
        annotations: {}
        config:
          extraLabelNs:
            - nvidia.com
        denyLabelNs: []
        deploymentAnnotations: {}
        enable: true
        enableTaints: false
        extraArgs: []
        extraEnvs: []
        extraLabelNs: []
        featureApi: null
        featureRulesController: null
        healthPort: 8082
        hostNetwork: false
        instance: null
        livenessProbe:
          grpc:
            port: 8082
        metricsPort: 8081
        nfdApiParallelism: null
        nodeSelector: {}
        podSecurityContext: {}
        rbac:
          create: true
        readinessProbe:
          failureThreshold: 10
          grpc:
            port: 8082
        replicaCount: 1
        resources:
          limits:
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 128Mi
        resyncPeriod: null
        revisionHistoryLimit: null
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        serviceAccount:
          annotations: {}
          create: true
          name: node-feature-discovery
        startupProbe:
          failureThreshold: 30
          grpc:
            port: 8082
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/master
            operator: Equal
            value: ""
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: ""

      nameOverride: ""
      namespaceOverride: ""
      priorityClassName: system-node-critical

      prometheus:
        enable: false
        labels: {}
        scrapeInterval: 10s

      topologyUpdater:
        affinity: {}
        annotations: {}
        config: null
        createCRDs: false
        daemonsetAnnotations: {}
        enable: false
        extraArgs: []
        extraEnvs: []
        healthPort: 8082
        hostNetwork: false
        kubeletConfigPath: null
        kubeletPodResourcesSockPath: null
        kubeletStateDir: /var/lib/kubelet
        livenessProbe:
          grpc:
            port: 8082
          initialDelaySeconds: 10
        metricsPort: 8081
        nodeSelector: {}
        podSecurityContext: {}
        podSetFingerprint: true
        rbac:
          create: true
        readinessProbe:
          failureThreshold: 10
          grpc:
            port: 8082
          initialDelaySeconds: 5
        resources:
          limits:
            memory: 60Mi
          requests:
            cpu: 50m
            memory: 40Mi
        revisionHistoryLimit: null
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsUser: 0
        serviceAccount:
          annotations: {}
          create: true
          name: null
        tolerations: []
        updateInterval: 60s
        watchNamespace: "*"

      worker:
        affinity: {}
        annotations: {}
        config:
          sources:
            pci:
              deviceClassWhitelist:
                - "02"
                - "0200"
                - "0207"
                - "0300"
                - "0302"
              deviceLabelFields:
                - vendor
        daemonsetAnnotations: {}
        enable: true
        extraArgs: []
        extraEnvs: []
        healthPort: 8082
        hostNetwork: false
        livenessProbe:
          grpc:
            port: 8082
          initialDelaySeconds: 10
        metricsPort: 8081
        mountUsrSrc: false
        nodeSelector: {}
        podSecurityContext: {}
        priorityClassName: ""
        rbac:
          create: true
        readinessProbe:
          failureThreshold: 10
          grpc:
            port: 8082
          initialDelaySeconds: 5
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 5m
            memory: 64Mi
        revisionHistoryLimit: null
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        serviceAccount:
          annotations: {}
          create: false
          name: node-feature-discovery
        tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/master
            operator: Equal
            value: ""
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
            operator: Equal
            value: ""
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists

    nodeStatusExporter:
      enabled: false
      image: gpu-operator-validator
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}

    operator:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: In
                    values:
                      - ""
              weight: 1
            - preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: In
                    values:
                      - ""
              weight: 1

      annotations:
        openshift.io/scc: restricted-readonly

      cleanupCRD: false
      image: gpu-operator
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []

      initContainer:
        image: cuda
        imagePullPolicy: IfNotPresent
        repository: nvcr.io/nvidia
        version: 13.0.0-base-ubi9

      logging:
        develMode: false
        level: info
        timeEncoding: epoch

      priorityClassName: system-node-critical
      repository: nvcr.io/nvidia

      resources:
        limits:
          cpu: 500m
          memory: 350Mi
        requests:
          cpu: 200m
          memory: 100Mi

      runtimeClass: nvidia

      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Equal
          value: ""
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Equal
          value: ""

      upgradeCRD: true
      use_ocp_driver_toolkit: false

    platform:
      openshift: false

    psa:
      enabled: false

    sandboxDevicePlugin:
      args: []
      enabled: true
      env: []
      image: kubevirt-gpu-device-plugin
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia
      resources: {}
      version: v1.4.0

    sandboxWorkloads:
      defaultWorkload: container
      enabled: false

    toolkit:
      enabled: true
      env: []
      image: container-toolkit
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      installDir: /usr/local/nvidia
      repository: nvcr.io/nvidia/k8s
      resources: {}
      version: v1.17.8-ubuntu20.04

    validator:
      repository: nvcr.io/nvidia
      image: gpu-operator
      version: v26.3.3

    vfioManager:
      driverManager:
        env: []
        image: k8s-driver-manager
        imagePullPolicy: IfNotPresent
        repository: nvcr.io/nvidia/cloud-native
        version: v0.8.1
      enabled: true
      env: []
      image: cuda
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia
      resources: {}
      version: 13.0.0-base-ubi9

    vgpuDeviceManager:
      config:
        default: default
        name: ""
      enabled: true
      env: []
      image: vgpu-device-manager
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: nvcr.io/nvidia/cloud-native
      resources: {}
      version: v0.4.0

    vgpuManager:
      driverManager:
        env: []
        image: k8s-driver-manager
        imagePullPolicy: IfNotPresent
        repository: nvcr.io/nvidia/cloud-native
        version: v0.8.1
      enabled: false
      env: []
      image: vgpu-manager
      imagePullPolicy: IfNotPresent
      imagePullSecrets: []
      repository: ""
      resources: {}
      version: ""