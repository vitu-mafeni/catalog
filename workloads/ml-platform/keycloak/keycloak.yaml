apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
type: Opaque
stringData:
  POSTGRES_DB: keycloak
  POSTGRES_USER: keycloak
  POSTGRES_PASSWORD: keycloakdbpass
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: keycloak-db-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keycloak
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Login theme override: removes every visual trace of Keycloak's "continue
# as <username>" restart screen (shown when re-authenticating an existing
# SSO session) — see keycloak-login-theme/ for the actual theme source.
# Purely a display tweak: clears the pre-filled value, hides the small
# "restart login" icon next to the field, and hides the "Please
# re-authenticate to continue" hint, all narrowly scoped so it can never
# touch the real Sign In button. The underlying session/auth logic is
# untouched — whatever username is actually submitted still works normally.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-login-theme
  namespace: keycloak
data:
  theme.properties: |
    parent=keycloak.v2
    scripts=js/clear-prefill.js
  clear-prefill.js: |
    (function () {
      function getField() { return document.getElementById('username'); }

      function isEssential(el) {
        var t = (el.textContent || '').trim().toLowerCase();
        return el.tagName === 'INPUT' || el.tagName === 'LABEL' ||
               el.getAttribute('type') === 'submit' ||
               /sign.?in|log.?in|submit|password/.test(t);
      }

      function hideRestartDecorations() {
        var field = getField();
        if (!field) return;
        field.setAttribute('autocomplete', 'off');

        var parent = field.parentElement;
        if (parent) {
          Array.prototype.forEach.call(parent.children, function (el) {
            if (el !== field && !isEssential(el) && (el.tagName === 'BUTTON' || el.tagName === 'A')) {
              el.style.display = 'none';
            }
          });
        }

        var scope = field.closest('form') || document.body;
        var candidates = scope.querySelectorAll('div, p, span, a');
        for (var i = 0; i < candidates.length; i++) {
          var el = candidates[i];
          if (el.children.length === 0 && !isEssential(el) && /re-?authenticate/i.test(el.textContent || '')) {
            el.style.display = 'none';
          }
        }
      }

      var userTyped = false;
      var attempts = 0;
      var MAX_ATTEMPTS = 40;
      var timer = setInterval(function () {
        attempts++;
        var el = getField();
        if (el) {
          if (attempts === 1) {
            el.addEventListener('input', function () { userTyped = true; }, { once: true });
          }
          if (!userTyped && el.value) el.value = '';
        }
        hideRestartDecorations();
        if (userTyped || attempts >= MAX_ATTEMPTS) clearInterval(timer);
      }, 50);
    })();
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              until nc -z postgres 5432; do
                echo "Waiting for postgres..."
                sleep 3
              done
              echo "Postgres is ready."
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.3
          args: ["start-dev"]
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "changeme123"
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/keycloak"
            # - name: KC_HOSTNAME
            #   value: 192.168.3.234
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_PORT
              value: "30090"
            # - name: KC_HTTP_ENABLED
            #   value: "true"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: login-theme
              mountPath: /opt/keycloak/themes/cnlab-noprefill/login
      volumes:
        - name: login-theme
          configMap:
            name: keycloak-login-theme
            items:
              - key: theme.properties
                path: theme.properties
              - key: clear-prefill.js
                path: resources/js/clear-prefill.js
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
